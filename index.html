<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moulik Archives ♡</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    background: #080808;
    color: #f5f0f2;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
    padding: 30px 20px;
}
.tag {
    color: #d78da9;
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 35px;
}
h1 {
    font-size: clamp(34px, 9vw, 55px);
    letter-spacing: 3px;
    line-height: 1.2;
    margin-bottom: 15px;
}
.heart {
    color: #ed9cbd;
}
.subtitle {
    color: #a9a0a4;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 55px;
}
.details {
    border-top: 1px solid #30232a;
    border-bottom: 1px solid #30232a;
    padding: 22px 10px;
    margin-bottom: 40px;
    text-align: left;
    line-height: 2.4;
    font-size: 11px;
    letter-spacing: 1px;
    color: #b9afb4;
}
.details span {
    color: #ed9cbd;
}
button {
    background: transparent;
    border: 1px solid #d78da9;
    color: #f5d9e5;
    padding: 15px 35px;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: #d78da9;
    color: #080808;
    box-shadow: 0 0 25px #d78da955;
}
.footer {
    margin-top: 55px;
    color: #655960;
    font-size: 10px;
    letter-spacing: 2px;
}
.glow {
    position: fixed;
    width: 220px;
    height: 220px;
    background: #d78da9;
    opacity: 0.07;
    filter: blur(100px);
    border-radius: 50%;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="container">
<div class="tag">✦ A PERSONAL PROJECT ✦</div>
<h1>MOULIK<br>ARCHIVES <span class="heart">♡</span></h1>
<div class="subtitle">
    A little universe, made with a lot of love.
</div>
<div class="details">
    SUBJECT: <span>ONE VERY SPECIAL HUMAN</span><br>
    CLASSIFICATION: <span>IRREPLACEABLE</span><br>
    STATUS: <span>PERMANENTLY LOVED</span><br>
    ACCESS: <span>EXCLUSIVELY YOURS</span>
</div>
<button onclick="enterProject()">ENTER ARCHIVES ↗</button>
<div class="footer">
    MADE WITH ♡ & A LITTLE TOO MUCH LOVE
</div>
</div>
<script>
function enterProject() {
    alert("Your little universe is still being prepared. ♡");
}
</script>
</body>
</html>
